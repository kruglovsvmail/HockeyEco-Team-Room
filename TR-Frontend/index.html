<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <meta name="color-scheme" content="dark light" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HockeyEco" />
    
    <!-- Системный статус-бар тёмный в обеих темах, и это решение, а не упущение.
         Следовать теме приложения он не может: когда Android ставит PWA как WebAPK,
         цвет панели запекается в него из theme_color манифеста при установке, и
         правки этой меты до него уже не доходят. Ставится ли WebAPK или обычный
         ярлык — решает система, поэтому на одних устройствах панель слушалась
         темы, а на других нет. Один постоянный цвет убирает эту лотерею.
         Значение обязано совпадать с theme_color в vite.config.js и с заливкой
         верхней safe-area зоны в App.jsx. -->
    <meta id="theme-meta" name="theme-color" content="#242424" />

    <title>HockeyEco | Кабинет команды</title>

    <script>
      /* 🚀 ЗАЩИТА ОТ ВСПОЛОХА БЕЛОГО ЭКРАHА ПРИ ХОЛОДHОМ СТАРТЕ PWA */
      (function () {
        /* theme-color здесь намеренно не трогаем: панель тёмная всегда, см. мету выше */
        const savedTheme = localStorage.getItem('tr_theme');
        document.documentElement.classList.toggle('dark', savedTheme === 'dark');

        /* Личный акцентный цвет пользователя (Настройки → Персонализация).
           Ставим до отрисовки, иначе на холодном старте успевает мелькнуть
           заводской синий — в логотипе сайдбара и на кнопках. */
        const savedBrand = localStorage.getItem('tr_brand_color');
        if (savedBrand && /^#[0-9a-fA-F]{6}$/.test(savedBrand)) {
          document.documentElement.style.setProperty('--color-brand-base', savedBrand);
        }
      })();
    </script>

    <style>
      /* 🎨 ФОH СТРАHИЦЫ ВО ВРЕМЯ ВРАЩЕHИЯ ЛОУДЕРА И ХОЛОДHОГО СТАРТА.
         Фон body также задаёт цвет нижней системной панели навигации Android в standalone-PWA.
         Значения зашиты явно (а не через CSS-переменную), чтобы на тёмной теме при
         холодном старте не мелькнула светлая панель до загрузки основного бандла стилей. */
      html, body {
        background-color: #f3f4f6;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.dark, html.dark body {
        background-color: #242424;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
